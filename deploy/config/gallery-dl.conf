{
    "base-directory": "/downloads",
    "extractor": {
        "facebook": {
            "cookies": "/config/fb-cookies.txt",
            "sleep": "5-10",
            "sleep-request": "10-20",
            "sleep-extractor": "3600",
            "sleep-429": "exp:2:0:36000=900",
            "sleep-retries": "exp:2:0:120=5",
            "fallback-retries": 4,
            "filename": "{date:%Y%m%d_%H%M%S}_{id}.{extension}",
            "archive": "/downloads/logs/fb-archive.sqlite3",
            "archive-format": "{set_id}_{id}",
            "postprocessors": [
                {"name": "metadata", "mode": "json"}
            ]
        }
    },
    "output": {
        "logfile": {
            "path": "/downloads/logs/fb-dl.log",
            "mode": "a",
            "level": "debug",
            "format": "[{asctime}] [{name}][{levelname}] {message}"
        }
    }
}
